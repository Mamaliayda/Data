name: Build APK

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        id: build
        run: |
          set +e
          gradle assembleDebug --stacktrace --info > build-log.txt 2>&1
          CODE=$?
          echo "GRADLE_EXIT=$CODE"
          # Always print tail to Actions log (visible without blob download)
          echo "===== BUILD LOG TAIL ====="
          tail -n 200 build-log.txt
          echo "===== END TAIL ====="
          # Also expose full log as step summary (rendered in GitHub UI)
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Keep summary under 1MB
          tail -c 900000 build-log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $CODE

      # On failure, commit the log to the same branch so it can be read via
      # the GitHub contents API (Azure blob download is blocked in this sandbox).
      - name: Publish build log to branch on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          cp build-log.txt ci-logs/build-log-${{ github.run_id }}.txt
          echo "Build failed — see ci-logs/build-log-${{ github.run_id }}.txt" > ci-logs/README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs/
          git commit -m "ci: build log for run ${{ github.run_id }}" || true
          git push origin HEAD:${{ github.ref_name }} || git push origin HEAD:arena/3e0a1028-data || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysData-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
