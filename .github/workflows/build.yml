name: Build APK

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-log.txt
          echo "GRADLE_EXIT=${PIPESTATUS[0]}"
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysData-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create issue with build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-log.txt', 'utf8'); } catch(e) { log = 'no log file: ' + e; }
            // keep body under 60k
            const tail = log.slice(-55000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed — run ${context.runId}`,
              body: `Branch \`${context.ref}\` — run ${context.runId} — [view run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n\`\`\`\n${tail}\n\`\`\``,
              labels: []
            });
